name: release download

# Builds Lorakeet-<version>.zip and SHA256SUMS.txt (tools/build_release.py) and attaches them to the GitHub release,
# when a release is published or by hand for an existing one (Actions tab -> release download -> Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach, e.g. v0.4.0"
        required: true

permissions:
  contents: write   # to attach files to the release

jobs:
  attach:
    name: Build and attach the release zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the build script and .gitattributes from main (so an older tag builds the same way), and every tag
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (the tag's VERSION must match it)
        run: python tools/build_release.py --ref "$TAG" --out dist
      - name: Attach to the release
        run: gh release upload "$TAG" dist/Lorakeet-*.zip dist/SHA256SUMS.txt --clobber
