name: tests

on:
  push:
  pull_request:
  workflow_dispatch:  # Actions tab -> tests -> Run workflow: also runs the other-platforms job on a private fork

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install --prefer-binary -r requirements.txt -r requirements-dev.txt
      - name: Tests (with a coverage report on one of them)
        shell: bash
        run: |
          if [ "${{ matrix.os }}-${{ matrix.python }}" = "ubuntu-latest-3.12" ]; then
            python -m pytest --ignore=tests/browser --cov --cov-report=term-missing:skip-covered
          else
            python -m pytest --ignore=tests/browser
          fi

  browser:
    # The pages in headless Chromium against a real Lorakeet on the demo mesh (tests/browser).
    name: Pages in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --prefer-binary -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/browser

  platforms:
    # macOS (Apple silicon) and Windows on ARM: where a dependency without a wheel for that platform shows up (the
    # cryptography gap did). --prefer-binary everywhere, as the installers do: cryptography's newest releases have
    # no Windows ARM wheel, so without it pip tries to compile one. Public repository only (free there; Windows ARM runners exist only for public ones), or by hand.
    if: github.repository == 'darthnut/lorakeet' || github.event_name == 'workflow_dispatch'
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --prefer-binary -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest --ignore=tests/browser

  checks:
    name: Syntax and release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Every Python file compiles
        run: python -m compileall -q .
      - name: Lint (ruff.toml, likely bugs and unused or undefined names)
        run: pip install ruff && ruff check .
      - name: Every page script and tool parses
        run: for f in static/*.js tools/*.mjs; do node --check "$f"; done
      - name: Shell scripts parse
        run: for f in deploy/*.sh install.sh; do bash -n "$f"; done
      - name: Nothing personal in the repository
        run: python tools/release_check.py

  install:
    # The install scripts, end to end on fresh machines, autostart included (these runners are thrown away), run
    # from the release zip (tools/build_release.py) rather than the checkout: what people actually download.
    name: Install script on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release zip
        run: python tools/build_release.py --out dist
      - name: install.sh --autostart, the launcher, then --uninstall
        if: runner.os == 'Linux'
        run: |
          unzip -q dist/Lorakeet-*.zip -d "$RUNNER_TEMP/zip" && cd "$RUNNER_TEMP"/zip/Lorakeet-*
          ./install.sh --autostart                      # also checks the zip kept install.sh executable
          ./install.sh                                  # running it again (an update) is harmless
          for i in $(seq 30); do curl -sf http://127.0.0.1:5190/api/version && break; sleep 2; done
          systemctl is-active lorakeet
          venv/bin/python lorakeet.pyw --no-browser     # already running: returns at once
          ./install.sh --uninstall
          ! systemctl is-active lorakeet
          test ! -d venv
      - name: install.ps1 (shortcuts, autostart), the launcher, then -Uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive (Get-Item dist\Lorakeet-*.zip) "$env:RUNNER_TEMP\zip"   # what Extract All does
          Set-Location (Get-Item "$env:RUNNER_TEMP\zip\Lorakeet-*").FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Yes -Autostart -NoOpen
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ScheduledTask -TaskName Lorakeet | Format-List TaskName, State
          $lnk = Join-Path ([Environment]::GetFolderPath("Desktop")) "Lorakeet.lnk"
          if (-not (Test-Path $lnk)) { throw "no desktop shortcut" }
          venv\Scripts\python lorakeet.pyw --no-browser   # starts it in the background, waits until it answers
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Invoke-WebRequest http://127.0.0.1:5190/api/version -UseBasicParsing).Content
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Uninstall -Yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path $lnk) { throw "shortcut left behind" }
          if (Get-ScheduledTask -TaskName Lorakeet -ErrorAction SilentlyContinue) { throw "autostart task left behind" }
          if (Test-Path venv) { throw "venv left behind" }
