# Listening station config (copied by deploy/setup-station.sh). Every option: lorakeet.example.toml.

[station]
name = ""             # what to call this station (default: its radio's name)
location = []         # [lat, lon] of the ANTENNA, e.g. [47.60620, -122.33210]
note = ""             # e.g. "attic window, facing north"

[sync]
# Filled in by pairing: on the hub, Stations -> Add a station gives a code; here, `venv/bin/python server.py --join -`
# (setup-station.sh asks for it) tests the hub and writes mode = "collector", hub_url and token below.
mode = "off"
interval_s = 15

[http]
lan = "off"           # "view" = a read-only dashboard on this station's own Wi-Fi
# hostnames = ["lorakeet-station.local"]   # to open that dashboard by name rather than by IP address
