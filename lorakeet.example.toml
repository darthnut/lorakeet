# Lorakeet configuration. Copy to `lorakeet.toml` (next to server.py, or point LORAKEET_CONFIG at it)
# and change what you need; anything left out uses the default shown here.

[radio]
# Serial port of the USB-connected Meshtastic radio, e.g. "COM7" (Windows) or "/dev/ttyACM0" (Linux).
# Empty = auto-detect. A port set here is used strictly (handy with several radios on USB); if it
# disappears, Lorakeet waits for it rather than picking another radio.
port = ""
# Or a radio on your network (Wi-Fi or Ethernet boards), by IP address or name, e.g. "192.168.1.50" or
# "meshtastic.local". Set this OR port, not both. The radio's network API listens on tcp_port (4403).
# Only one app can use the radio's network connection at a time: close the phone app's Wi-Fi link.
# Over the network you get decoded packets but no per-reception detail: radios send their debug log
# (duplicates, relays, airtime) only over USB.
host = ""
tcp_port = 4403

[storage]
# Where the database and logs live. Empty = per-OS default:
#   Windows %LOCALAPPDATA%\Lorakeet, macOS ~/Library/Application Support/Lorakeet, Linux ~/.local/share/lorakeet
# Lorakeet writes a little all the time (a few MB a day). A Raspberry Pi's SD card is fine for a station;
# for years of logging on a hub, a disk or SSD lasts longer.
data_dir = ""
# Warn (dashboard banner + notification) when the database reaches this size. Nothing is ever deleted.
db_warn_gb = 1.0
# The radio's firmware debug log is high-volume; keep it this many days.
debug_log_days = 7

[logging]
# Store the recipient of directed packets your radio overhears between other nodes. Header data
# like this is visible to any radio in range; turn it off if you'd rather not keep it.
store_recipients = true

[backup]
# Folders to copy a compressed, integrity-checked backup into each night, e.g. a cloud-synced folder.
# Empty = no backups.
destinations = []
time = "03:30"

[http]
port = 5190
# "off"  = the dashboard is reachable from this computer only.
# "view" = other devices on your local network get a read-only view (sending and settings stay
#          on this computer). You may also need to allow the port through your firewall.
# "login" = other devices on your local network see nothing until they log in.
# With a password set (python server.py --set-password), a device that logs in gets full access:
# sending, traceroutes, settings (the Radio, Stations and setup pages stay on this computer only).
# Forgot it? python server.py --clear-password. The password is stored only as a salted hash, in login.json in the
# data folder. It's plain HTTP, so anyone able to watch your network could read it: fine for keeping
# guests on your Wi-Fi from sending on your radio, not a way to put the dashboard on the internet.
lan = "off"
# Names the dashboard may be opened by, besides IP addresses and localhost (e.g. "desk-pc" or
# "lorakeet-station.local"). Any other name is refused: that blocks "DNS rebinding", where a web page you visit points its own
# name at this computer to reach the dashboard through your browser.
hostnames = []

[map]
# [lat, lon] to show before any node has shared a position. Empty = world view.
center = []
zoom = 10
# Map tiles. "osm" (default): OpenStreetMap's standard tiles (dark mode shows the same tiles darkened) and
# OpenTopoMap terrain, free with attribution for light personal use (OpenStreetMap's tile usage policy applies).
# "esri": Esri's maps plus satellite imagery; check Esri's terms first.
tiles = "osm"

[base]
# Optionally feature one node as your base station (its own card, watched by default), e.g. "!1234abcd".
id = ""
name = ""

[alerts]
# Scheduled traceroutes transmit on the shared mesh, so they're off for new installs. You can turn them
# on later from the 🔔 panel; after the first run the setting is stored and this default no longer applies.
auto_traceroute = false

[remote]
# Ask this station how it's doing over the mesh, for when it has no internet: send its radio a DIRECT
# message "lk status" (uptime, network, sync backlog, temperature/power, GPS) or "lk gps" (exact position);
# "lk help" lists them. It answers by direct message (that transmits). Read-only: nothing restarts or changes.
# Only PKI-encrypted direct messages (firmware 2.5+) from the radios below count, and only if sent with the
# key this station first recorded for them. Channel messages are never commands.
enabled = false
allow = []              # e.g. ["!1234abcd"]: your own radios

[mcp]
# mcp_server.py lets an LLM app (Claude Desktop, Claude Code, any MCP client) use Lorakeet without reading the
# screen: see docs/API.md. It can always READ everything the dashboard shows. These let it do more; each is off
# until you turn it on here (the LLM has no way to turn them on itself):
allow_changes = false   # watch radios, pause/resume logging, change alert settings, mark alerts read, back up, restart
allow_transmit = false  # send text messages and run traceroutes: they go out on the mesh under your radio's name
# Radio settings, channels and keys, pairing and peering are never offered to an LLM: use the Radio and Stations pages.

[sync]
# Several listening stations, one database. A "collector" (a station) logs what its own radio hears (keeping a
# local copy, so nothing is lost while offline) and sends it to a "hub", which stores every station's data with a
# `station` column. See docs/PI-SETUP.md.
# Usually you don't edit this by hand: on the hub, the Stations page writes mode and allow; on a station, a
# pairing code (setup page, Stations page, or `python server.py --join -`) writes mode, hub_url and token. Stations
# connect over your local network or Tailscale, never the open internet. Peering with other people's hubs is set
# up on the Stations page too (kept in peers.json in the data folder, not here).
# The settings below are also the older, by-hand way: one shared token typed into both ends.
mode = "off"            # "off", "collector" or "hub"
# collector: the hub's address on your local network or Tailscale, e.g. "http://home-pc:5190"
hub_url = ""
# the same secret on both ends, 16+ characters. Generate one with:
#   python -c "import secrets; print(secrets.token_urlsafe(24))"
token = ""
interval_s = 60         # collector: seconds between sync passes
# hub: networks collectors may send from. Default = Tailscale's address ranges; the Stations page adds your local
# network's ranges when you pick it. A hub listens on all
# interfaces even with http.lan = "off", but only /api/ingest (with the token) answers those networks.
allow = ["100.64.0.0/10", "fd7a:115c:a1e0::/48"]
# hub: one secret per station (recommended once there are several). A station listed here must use its own
# token; the shared token then only works for stations not listed. Each station's own lorakeet.toml puts
# its token in sync.token. Revoke a station by removing its line.
station_tokens = []     # e.g. ["!1234abcd:<token>", "!5678ef90:<token>"]
require_station_tokens = false   # true = refuse the shared token entirely

[station]
# This listening station. The location is the ANTENNA's, as exact as you can (a phone's map app is fine):
# it places the station on the maps and anchors position estimates for nodes that never share one.
# Stations sync it to the hub, so set it on each station.
name = ""             # default: the radio's name
location = []         # [lat, lon] or [lat, lon, altitude_m]
note = ""             # e.g. "attic window, facing north"
# mobile = true: a station that moves (a car). Leave location empty: it comes from the radio's own GPS
# fixes, logged as it goes, so every reception can be placed where the station was at the time.
mobile = false
# Drive mode (with mobile = true), TRANSMITS: ping a private channel every drive_ping_m metres moved (never while
# parked), at most once per drive_ping_min_s, so Visualizations -> Coverage can show where the mesh heard you.
# Each ping is ~0.6 s of shared airtime (plus relays repeating it): keep it for test drives.
drive_pings = false
drive_ping_m = 1000
drive_ping_min_s = 60
drive_ping_channel = "Lorakeet"   # by name; refused if the channel uses a public key
